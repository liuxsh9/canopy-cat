name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable Windows x64 executable
        run: |
          rustup target add x86_64-pc-windows-msvc
          npm run build:desktop -- -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item desktop/src-tauri/target/x86_64-pc-windows-msvc/release/canopy-cat.exe CanopyCat-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: canopy-cat-windows-x64
          path: CanopyCat-windows-x64.exe
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: git tag ($GITHUB_REF_NAME) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build & pack tarball
        id: pack
        run: |
          npm run build:lib
          TARBALL="$(npm pack | tail -n 1)"
          cp "$TARBALL" canopy-cat.tgz
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: canopy-cat-windows-x64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi

          ASSETS=("$TARBALL" canopy-cat.tgz dist/canopy-cat.js CanopyCat-windows-x64.exe)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --generate-notes
          fi
